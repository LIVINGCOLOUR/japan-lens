name: collect

# 毎時、RSS を収集して AI 処理し、web/data/store.json をコミットする。
# ホスティング（Vercel / Cloudflare Pages など）は main への push を検知してサイトを作り直す。
on:
  schedule:
    - cron: "7 * * * *" # 毎時7分
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: python main.py
        working-directory: collector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit data
        run: |
          if git diff --quiet -- web/data/store.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "japan-lens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/store.json
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
