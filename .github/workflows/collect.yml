name: collect

# 1日1回、RSS を収集して AI 処理し、web/data/store.json（日本の出来事）と world.json（世界の主要ニュース）をコミットする。
# ホスティング（Vercel / Cloudflare Pages など）は main への push を検知してサイトを作り直す。
on:
  schedule:
    - cron: "7 21 * * *" # 毎日 6:07（日本時間）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      # AI 処理は Claude Code の CLI をサブスクリプションの認証で呼ぶ（API の従量課金なし）
      - run: npm install -g @anthropic-ai/claude-code
      # 手動実行のときだけ、サブスクリプションの認証が通るか確かめる
      - name: Check Claude auth
        if: github.event_name == 'workflow_dispatch'
        run: echo "OK とだけ返してください" | claude -p --tools ""
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - run: python main.py
        working-directory: collector
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Commit data
        run: |
          if git diff --quiet -- web/data/store.json web/data/world.json web/data/readings.json collector/state && [ -z "$(git ls-files --others --exclude-standard collector/state web/data)" ]; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "japan-lens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/store.json web/data/world.json web/data/readings.json collector/state/leads.json collector/state/world.json
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
